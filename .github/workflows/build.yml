name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Se añaden dependencias necesarias para arquitecturas modernas de Android
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      # CORRECCIÓN 1: Se actualiza Cython a la serie 3.0.x (requerida para Python 3.11)
      - name: Install Buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install "cython>=3.0.0,<3.1.0"
          pip3 install https://github.com/kivy/buildozer/archive/master.zip

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer local directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}

      # CORRECCIÓN 2: Se eliminó "yes |". Usamos el comando nativo de licencias
      # y ejecutamos en modo "verbose" (-v) para rastrear fallos ocultos.
      # Se incluye la variable ACCEPT_EULA para herramientas internas del SDK.
      - name: Build with Buildozer
        env:
          BUILDOZER_ALLOW_ORG_BUILD: "1"
          ACCEPT_EULA: "Y"
        run: |
          buildozer android licenses
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
