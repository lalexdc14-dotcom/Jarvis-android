name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Se añade de forma nativa la configuración de Java 17 recomendada por GitHub
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install Buildozer and Cython
        run: |
          pip3 install --upgrade pip
          pip3 install cython==0.29.36
          pip3 install https://github.com/kivy/buildozer/archive/master.zip

      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ hashFiles('buildozer.spec') }}

      - name: Cache buildozer local directory
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-local-${{ hashFiles('buildozer.spec') }}

      # CORRECCIÓN: Se eliminó el paso manual de licencias y se fuerza a Buildozer 
      # a aceptarlas de manera automática mediante una variable de entorno oficial.
      # También añadimos "yes |" como respaldo definitivo.
      - name: Build with Buildozer
        env:
          BUILDOZER_ALLOW_ORG_BUILD: "1"
          ANDROID_SDK_HOME: "/home/runner/.android"
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk
          path: bin/*.apk
